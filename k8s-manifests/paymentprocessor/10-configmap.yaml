apiVersion: v1
kind: ConfigMap
metadata:
  name: paymentprocessor-config
  namespace: default
  labels:
    app: paymentprocessor
    app.kubernetes.io/name: paymentprocessor
    app.kubernetes.io/component: config
data:
  SERVER_PORT: "8081"
  HEALTH_DETAILS: "always"
  LOG_LEVEL_ROOT: "INFO"
  LOG_LEVEL_APP: "INFO"
  LOG_LEVEL_JDBC: "INFO"
  HIBERNATE_DDL_AUTO: "update"
  TIMEZONE: "UTC"
