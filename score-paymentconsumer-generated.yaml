apiVersion: score.dev/v1b1

metadata:
  name: paymentconsumer

containers:
  app:
    image: ghcr.io/alokkulkarni/paymentconsumer/paymentconsumer:latest
    variables:
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${resources.db.host}:${resources.db.port}/${resources.db.name}"
      SPRING_DATASOURCE_USERNAME: ${resources.db.username}
      SPRING_DATASOURCE_PASSWORD: ${resources.db.password}
      BENEFICIARIES_SERVICE_URL: http://localhost:8080
      PAYMENT_PROCESSOR_SERVICE_URL: http://localhost:8081
      HEALTH_DETAILS: always
      LOG_LEVEL_ROOT: INFO
      LOG_LEVEL_APP: INFO
      LOG_LEVEL_JDBC: INFO
      HIBERNATE_DDL_AUTO: update
      TIMEZONE: UTC

service:
  ports:
    app:
      port: 8082
      targetPort: 8082
      protocol: TCP

resources:
  db:
    type: postgres
    metadata:
      annotations:
        database: paymentConsumer
        username: postgres
        password: postgres
        init-script: ./paymentConsumer/init.db
